[project]
name = "jupyterhub"
version = "4.0.0"
description = "JupyterHub dependencies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "humanfriendly>=10.0",
    "jwt>=1.4.0",
    "ldap3>=2.9.1",
    "requests>=2.34.2",
    "tapipy>=25.4.0",
    "tenacity>=9.0.0",
    "tornado>=6.5.6",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "responses>=0.26.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
